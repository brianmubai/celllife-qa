name: CI & Build Verification

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Run Linter
        run: npm run lint

      - name: Build Production Bundle
        run: npm run build

      - name: Verify Server Startup
        run: |
          node server/index.js &
          SERVER_PID=$!
          sleep 3
          curl -f http://localhost:4000/api/health || exit 1
          kill $SERVER_PID
